name: VOMIXStudio Official Multiplatform Release Pipeline

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name for release (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compile-wasm:
    name: 📦 Compile C++ WebAssembly to SIMD
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🛠️ Install Emscripten SDK
        run: |
          git clone https://github.com/emscripten-core/emsdk.git ../emsdk_toolchain
          cd ../emsdk_toolchain
          ./emsdk install latest
          ./emsdk activate latest
          echo "$PWD" >> $GITHUB_PATH
          echo "$PWD/upstream/emscripten" >> $GITHUB_PATH

      - name: ⚡ Compile Modular C++ DSP Core to WASM SIMD
        shell: bash
        run: |
          bash src/cpp/build_wasm.sh

      - name: 📤 Upload WASM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-assets
          path: public/wasm/
          retention-days: 1

  build-and-release:
    name: 🚀 Build ${{ matrix.platform.name }} Release Assets
    runs-on: ${{ matrix.platform.os }}
    needs: compile-wasm
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Windows x64
            os: windows-latest
            asset-pattern: "src-tauri/target/release/bundle/{msi/*.msi,nsis/*.exe}"
          - name: Linux x64
            os: ubuntu-22.04
            asset-pattern: "src-tauri/target/release/bundle/{appimage/*.AppImage,deb/*.deb}"
          - name: macOS Universal
            os: macos-latest
            asset-pattern: "src-tauri/target/release/bundle/dmg/*.dmg"

    permissions:
      contents: write
      discussions: write

    steps:
      # =========================================================================
      # 1. ЧЕКАУТ РЕПОЗИТОРИЯ
      # =========================================================================
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # =========================================================================
      # 2. УСТАНОВКА И КЭШИРОВАНИЕ NODE.JS
      # =========================================================================
      - name: 🟢 Setup Node.js v22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install NPM dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      # =========================================================================
      # 3. СИСТЕМНЫЕ ЗАВИСИМОСТИ LINUX
      # =========================================================================
      - name: 🐧 Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential curl wget file libssl-dev libasound2-dev

      # =========================================================================
      # 4. ЗАГРУЗКА СКОМПИЛИРОВАННОГО C++ WEBASSEMBLY ЯДРА
      # =========================================================================
      - name: 📥 Download WASM Artifacts
        uses: actions/download-artifact@v4
        with:
          name: wasm-assets
          path: public/wasm

      # =========================================================================
      # 6. ВАЛИДАЦИЯ ВЕРСИЙ, ЛИНТИНГ И ИКОНКИ
      # =========================================================================
      - name: 🔍 Validate Version Synchronization
        run: npm run version:check

      - name: 🧹 Run Linter & Typecheck
        run: npm run lint

      - name: 🎨 Generate Application Icons
        run: npm run generate:icons

      # =========================================================================
      # 7. СБОРКА НАТИВНЫХ УСТАНОВЩИКОВ TAURI V2
      # =========================================================================
      - name: 🦀 Configure Rust Toolchain & Build Desktop App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # =========================================================================
      # 8. ПУБЛИКАЦИЯ В GITHUB RELEASES
      # =========================================================================
      - name: 🏷️ Publish Assets to Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0') }}
          name: "VOMIXStudio ${{ github.event.inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0') }}"
          draft: false
          prerelease: false
          files: ${{ matrix.platform.asset-pattern }}
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
