name: VOMIXStudio CI/CD - Multiplatform Build (Windows, Linux, macOS)

on:
  push:
    branches: [ "main", "master", "release/*" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 🚀 Build ${{ matrix.platform.name }} (${{ matrix.platform.os }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Windows x64
            os: windows-latest
            asset-name: VOMIXStudio-Windows-x64
            bundle-path: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe

          - name: Linux x64
            os: ubuntu-22.04
            asset-name: VOMIXStudio-Linux-x64
            bundle-path: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb

          - name: macOS Apple Silicon / Intel
            os: macos-latest
            asset-name: VOMIXStudio-macOS
            bundle-path: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/macos/*.app

    steps:
      # =========================================================================
      # 1. ЧЕКАУТ РЕПОЗИТОРИЯ
      # =========================================================================
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # =========================================================================
      # 2. УСТАНОВКА И КЭШИРОВАНИЕ NODE.JS
      # =========================================================================
      - name: 🟢 Setup Node.js v22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install NPM dependencies
        run: npm ci --legacy-peer-deps

      # =========================================================================
      # 3. СИСТЕМНЫЕ ЗАВИСИМОСТИ LINUX (WebKit2GTK, AppImage tools)
      # =========================================================================
      - name: 🐧 Install Linux System Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential curl wget file libssl-dev libasound2-dev

      # =========================================================================
      # 4. УСТАНОВКА EMSCRIPTEN SDK ДЛЯ C++ WEBASSEMBLY SIMD (Вне рабочей директории проекта)
      # =========================================================================
      - name: 🛠️ Install Emscripten SDK (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          git clone https://github.com/emscripten-core/emsdk.git ..\emsdk_toolchain
          cd ..\emsdk_toolchain
          .\emsdk.bat install latest
          .\emsdk.bat activate latest
          echo "$PWD" >> $env:GITHUB_PATH
          echo "$PWD/upstream/emscripten" >> $env:GITHUB_PATH

      - name: 🛠️ Install Emscripten SDK (Linux & macOS)
        if: runner.os != 'Windows'
        run: |
          git clone https://github.com/emscripten-core/emsdk.git ../emsdk_toolchain
          cd ../emsdk_toolchain
          ./emsdk install latest
          ./emsdk activate latest
          echo "$PWD" >> $GITHUB_PATH
          echo "$PWD/upstream/emscripten" >> $GITHUB_PATH

      # =========================================================================
      # 5. КОМПИЛЯЦИЯ C++ DSP ЯДРА В WEBASSEMBLY SIMD
      # =========================================================================
      - name: ⚡ Compile C++ Core to WASM SIMD (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path public/wasm
          if (Test-Path "c_src/daw_core.cpp") {
            ..\emsdk_toolchain\upstream\emscripten\emcc.bat -O3 -msimd128 -s WASM=1 -s ALLOW_MEMORY_GROWTH=1 `
              -s INITIAL_MEMORY=67108864 `
              -s EXPORTED_FUNCTIONS="['_malloc','_free','_daw_init','_daw_process']" `
              -s EXPORTED_RUNTIME_METHODS="['cwrap','ccall','setValue','getValue']" `
              -o public/wasm/daw_core.js c_src/daw_core.cpp
          } else {
            echo "// Auto-generated WASM fallback module" | Out-File -Encoding utf8 public/wasm/daw_core.js
          }

      - name: ⚡ Compile C++ Core to WASM SIMD (Linux & macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p public/wasm
          if [ -f "c_src/daw_core.cpp" ]; then
            ../emsdk_toolchain/upstream/emscripten/emcc -O3 -msimd128 -s WASM=1 -s ALLOW_MEMORY_GROWTH=1 \
              -s INITIAL_MEMORY=67108864 \
              -s EXPORTED_FUNCTIONS="['_malloc','_free','_daw_init','_daw_process']" \
              -s EXPORTED_RUNTIME_METHODS="['cwrap','ccall','setValue','getValue']" \
              -o public/wasm/daw_core.js c_src/daw_core.cpp
          else
            echo "// Auto-generated WASM fallback module" > public/wasm/daw_core.js
          fi

      # =========================================================================
      # 6. ПРОВЕРКА ВЕРСИИ, ЛИНТИНГ И ИКОНКИ
      # =========================================================================
      - name: 🔍 Check Release Version Synchronization
        run: npm run version:check

      - name: 🧹 TypeScript Typecheck & Lint
        run: npm run lint

      - name: 🎨 Generate Application Icons
        run: npm run generate:icons

      # =========================================================================
      # 7. СБОРКА НАТИВНОГО ПРИЛОЖЕНИЯ TAURI V2
      # =========================================================================
      - name: 🏗️ Build Native Desktop Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__

      # =========================================================================
      # 8. СОХРАНЕНИЕ АРТЕФАКТОВ СБОРКИ В GITHUB ACTIONS
      # =========================================================================
      - name: 📤 Upload Platform Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.asset-name }}
          path: ${{ matrix.platform.bundle-path }}
          retention-days: 14
