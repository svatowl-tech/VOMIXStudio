[package]
name = "vomix_studio_desktop"
version = "1.0.0"
description = "Native Windows C++ Audio Workstation built with Tauri v2"
authors = ["Lead Systems Engineering Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.5", features = [] }

[dependencies]
tauri = { version = "2.2.0", features = ["protocol-asset"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
